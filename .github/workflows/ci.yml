name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tests that need nats-server fail instead of skipping when it is missing.
  LICTOR_REQUIRE_NATS: "1"
  DEFAULT_NATS_VERSION: v2.15.3

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test-linux:
    name: Test (Linux, NATS ${{ matrix.nats }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, every maintained minor, and latest.
        nats: [v2.10.29, v2.11.17, v2.12.15, v2.14.10, v2.15.3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nats-server ${{ matrix.nats }}
        run: ./scripts/install-nats-server.sh "${{ matrix.nats }}" "$RUNNER_TEMP/nats" >> "$GITHUB_PATH"
      - run: nats-server --version
      - run: cargo test --workspace --all-features --locked --no-fail-fast

  test-os:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nats-server
        shell: bash
        run: ./scripts/install-nats-server.sh "$DEFAULT_NATS_VERSION" "$RUNNER_TEMP/nats" >> "$GITHUB_PATH"
      - run: cargo test --workspace --all-features --locked --no-fail-fast

  ui:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Unit and component tests
        run: npm run test:unit -- --run
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build lictor with the UI embedded
        working-directory: .
        run: cargo build -p lictor --locked
        env:
          LICTOR_REQUIRE_UI: "1"
      - name: End-to-end tests (real agents, real browser)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7

  consul:
    name: Consul compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pull the reference images
        run: docker pull hashicorp/consul:1.22.7 && docker pull prom/prometheus:v3.16.0
      # The same services registered in Consul and in Lictor, DNS and HTTP answers compared; then a
      # real Prometheus with a consul_sd_configs job discovering targets through a Lictor agent.
      - run: cargo test -p lictor --test consul_compat --locked -- --nocapture
        env:
          LICTOR_DOCKER_TESTS: "1"

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install nats-server
        run: ./scripts/install-nats-server.sh "$DEFAULT_NATS_VERSION" "$RUNNER_TEMP/nats" >> "$GITHUB_PATH"
      - run: cargo llvm-cov --workspace --all-features --locked --no-fail-fast --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm
      - uses: mlugg/setup-zig@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI
        run: npm --prefix ui ci && npm --prefix ui run build
      - run: ./scripts/package.sh x86_64-unknown-linux-musl dist
        env:
          LICTOR_REQUIRE_UI: "1"
      - name: The static binary runs
        run: |
          file target/x86_64-unknown-linux-musl/release/lictor
          target/x86_64-unknown-linux-musl/release/lictor --version
      - name: The binary serves the embedded UI
        run: |
          bin=target/x86_64-unknown-linux-musl/release/lictor
          "$bin" agent --dev --http-addr 127.0.0.1:7171 --data-dir "$RUNNER_TEMP/lictor" &
          for _ in $(seq 50); do curl -fsS http://127.0.0.1:7171/ui/ -o ui.html && break; sleep 0.2; done
          grep -q '_app/immutable' ui.html
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:7171/ui/services/web
          kill %1
      - name: Install the .deb and run it
        run: |
          sudo apt-get install -y ./dist/*.deb
          lictor --version
          systemctl cat lictor.service
          test -f /etc/lictor/lictor.conf
          getent passwd lictor
      - name: The Docker Compose files are valid
        run: |
          docker compose -f deploy/docker/compose.yaml config -q
          docker compose -f deploy/docker/compose.nats.yaml config -q
      - name: Inspect the .rpm
        run: |
          sudo apt-get install -y rpm
          rpm -qpl dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: package-smoke
          path: dist/
