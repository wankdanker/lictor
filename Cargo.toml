[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/wankdanker/lictor"
homepage = "https://github.com/wankdanker/lictor"
authors = ["Dan VerWeire"]

[workspace.dependencies]
lictor-types = { path = "crates/lictor-types", version = "0.1.0" }
lictor-store = { path = "crates/lictor-store", version = "0.1.0" }
lictor-store-nats = { path = "crates/lictor-store-nats", version = "0.1.0" }
lictor-consul = { path = "crates/lictor-consul", version = "0.1.0" }
lictor-core = { path = "crates/lictor-core", version = "0.1.0" }

clyops = { git = "https://github.com/wankdanker/clyops", tag = "v0.13.1" }
async-nats = { version = "0.53", default-features = false }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
humantime = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

gethostname = "1"
form_urlencoded = "1"

hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
