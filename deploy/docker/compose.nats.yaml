# Just NATS with JetStream, for running `lictor` on your machine against a real backend:
#
#   docker compose -f deploy/docker/compose.nats.yaml up -d
#   lictor agent --nats-url nats://127.0.0.1:4222
#
# Ports (bound to localhost only):
#   4222  NATS clients (lictor agents, `lictor --direct`, the `nats` CLI)
#   8222  NATS monitoring: http://127.0.0.1:8222 (/healthz, /jsz, /connz)
#
# Data is kept in the `nats-data` volume; `docker compose ... down -v` deletes it.
name: lictor-nats

services:
  nats:
    image: nats:2.15-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222", "--server_name", "lictor-nats"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

volumes:
  nats-data:
