# Lictor configuration. One option per line: name = value.
# Any option of `lictor agent --help` (or `lictor --help`) may be set here.
# Environment variables (LICTOR_*) apply when an option is not set here or on the command line.

# NATS
nats-url = nats://127.0.0.1:4222
# nats-creds = /etc/lictor/nats.creds
# nats-tls-ca = /etc/lictor/ca.pem

# This node
# namespace = default
# region = dc1
# advertise = 10.0.0.5
# node-meta = rack=r12,zone=a

# Service definitions (*.toml, *.json) registered at start
config-dir = /etc/lictor/conf.d

# Agent HTTP API (keep it on loopback, or set a token)
# http-addr = 127.0.0.1:7171
# token = change-me

# Production NATS clusters should keep three copies of each bucket
# replicas = 3
