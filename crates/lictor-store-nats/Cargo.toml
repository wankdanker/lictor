[package]
name = "lictor-store-nats"
description = "NATS JetStream KV storage backend for Lictor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# `lictor_store_nats::testing`: start throwaway nats-server processes from tests.
testing = ["dep:tempfile"]

[dependencies]
lictor-store.workspace = true
async-nats = { workspace = true, features = ["server_2_10", "server_2_11", "ring", "jetstream", "kv", "nkeys", "nuid"] }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "fs"] }
tokio-stream.workspace = true
tracing.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
lictor-store = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait.workspace = true

[[test]]
name = "conformance"
required-features = ["testing"]
